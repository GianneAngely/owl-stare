<!doctype html>
<!-- itch.io cover (630x500): the eight owls staring, title, tagline. Screenshot with:
     node tools/check.mjs tools/cover.html 630x500 1500 itch/cover.png -->
<meta charset="utf-8">
<link rel="stylesheet" href="../assets/fonts/gaegu.css">
<style>
  html, body { margin: 0; width: 630px; height: 500px; overflow: hidden; background: #f7f3e8; font-family: "Gaegu", sans-serif; color: #2b2622; }
  .frame { position: absolute; inset: 12px; border: 5px solid #2b2622; border-radius: 6px 10px 8px 12px; }
  h1 { position: absolute; top: 28px; width: 100%; margin: 0; text-align: center; font-size: 92px; font-weight: 700; letter-spacing: 2px; }
  p { position: absolute; bottom: 30px; width: 100%; margin: 0; text-align: center; font-size: 30px; font-weight: 700; }
  #owls { position: absolute; left: 0; right: 0; top: 150px; height: 290px; }
  #owls img { position: absolute; }
</style>
<div class="frame"></div>
<h1>Owl Stare</h1>
<div id="owls"></div>
<p>Don't blink. Don't laugh. Don't look away.</p>
<script type="module">
  import { owlSVG, dataURL } from "../src/art/owl.js";
  import { OWLS } from "../src/owls/index.js";
  // the boss big in the middle, the others in two rows behind it
  const spots = [[55, 40, 115], [160, 20, 110], [425, 20, 110], [505, 40, 110], [15, 150, 125], [120, 140, 130], [405, 140, 130], [495, 150, 125]];
  const box = document.getElementById("owls");
  const add = (o, face, x, y, h) => box.append(Object.assign(new Image(), { src: dataURL(owlSVG(face, o.look)), style: `left:${x}px;top:${y}px;height:${h}px` }));
  OWLS.filter((o) => o.id !== "boss").concat(OWLS.find((o) => o.id === "twins")).forEach((o, i) => add(o, o.rest, ...spots[i]));
  add(OWLS.find((o) => o.id === "boss"), "sleepy", 206, 40, 240);
</script>
