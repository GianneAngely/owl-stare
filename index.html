<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Owl Stare</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦉</text></svg>">
<link rel="stylesheet" href="assets/fonts/gaegu.css">
<style>
  :root { --ink: #2b2622; --paper: #f7f3e8; --belly: #fbf8ee; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--paper); touch-action: none;
    user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  #game { position: fixed; inset: 0; }
  /* self-view: small, mirrored, bottom right, like the concept screen */
  #me { position: fixed; right: max(16px, 3vmin); bottom: max(16px, 3vmin); width: clamp(110px, 20vmin, 200px); aspect-ratio: 4 / 3; }
  #me video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); box-sizing: border-box;
    border: 3px solid var(--ink); border-radius: 16px; background: #d9d3c4; }
  #me.off video { visibility: hidden; }
  #me.off::before { content: "you're hidden"; position: absolute; inset: 0; display: grid; place-items: center; box-sizing: border-box;
    border: 3px dashed var(--ink); border-radius: 16px; font: 700 16px "Gaegu", sans-serif; color: var(--ink); background: var(--belly); }
  #mute { position: fixed; top: max(22px, 4vmin); right: max(22px, 4vmin); width: 40px; height: 40px; padding: 0; border-radius: 50%; cursor: pointer;
    background: var(--belly); border: 3px solid var(--ink); font-size: 18px; line-height: 1; }
  #me-toggle { position: absolute; top: -12px; left: -12px; width: 34px; height: 34px; padding: 0; border-radius: 50%; cursor: pointer;
    background: var(--belly); border: 3px solid var(--ink); font: 700 15px "Gaegu", sans-serif; color: var(--ink); line-height: 1; }
</style>
</head>
<body>
<div id="game"></div>
<button id="mute" aria-label="Sound on or off" title="Sound on / off">🔊</button>
<div id="me" hidden>
  <video id="me-video" playsinline muted></video>
  <button id="me-toggle" aria-label="Hide or show my camera preview" title="Hide / show me">👁</button>
</div>
<script src="lib/phaser.min.js"></script>
<script type="module" src="src/main.js"></script>
</body>
</html>
