<!doctype html><meta charset="utf-8"><title>probe</title>
<script type="module">
// Runs FaceLandmarker on still photos and reports the game's signals for each (used by the headless checks).
import { FaceLandmarker, FilesetResolver } from "../lib/mediapipe/vision_bundle.mjs";
import { toSignals } from "../src/face/signals.js";
window.probe = async (names) => {
  const files = await FilesetResolver.forVisionTasks("../lib/mediapipe/wasm");
  const lm = await FaceLandmarker.createFromOptions(files, { baseOptions: { modelAssetPath: "../models/face_landmarker.task", delegate: "CPU" },
    runningMode: "IMAGE", numFaces: 1, outputFaceBlendshapes: true, outputFacialTransformationMatrixes: true });
  const out = {};
  for (const n of names) {
    const img = new Image(); img.src = "fixtures/" + n; await img.decode();
    const s = toSignals(lm.detect(img), 0);
    out[n] = s.face ? [s.blinkL, s.blinkR, s.smile, s.jaw, s.yaw, s.pitch].map((x) => +x.toFixed(2)).join(" ") : "noface";
  }
  return out;
};
</script>
